name: Deploiement automatise Terraform + Ansible

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validation:
    name: Validation IaC (fmt, tflint, trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: Setup Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Validation complete (make check)
        run: make check CIDR_ADMIN=0.0.0.0/0

      - name: Terraform plan (make plan)
        run: make plan CIDR_ADMIN=0.0.0.0/0

      - name: Sauvegarder le plan pour le job deploy
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: envs/dev-aws/dev.tfplan

  deploy:
    name: Deploiement AWS + provisioning Ansible
    needs: validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Terraform init (make init)
        run: make init

      - name: Recuperer le plan valide par le job validation
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: envs/dev-aws

      - name: Terraform apply (make apply)
        run: make apply CIDR_ADMIN=0.0.0.0/0

      - name: Installer Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible

      - name: Attendre que SSH soit disponible
        run: sleep 30

      - name: Generer l'inventaire (make inventory)
        run: make inventory

      - name: Lancer le playbook Ansible (make configure)
        run: make configure

      - name: Afficher l'URL du site deploye
        working-directory: envs/dev-aws
        run: terraform output url_publique
